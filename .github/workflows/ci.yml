name: ci
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - run: bun audit --audit-level=high
  tiles:
    name: ci / tiles
    runs-on: ubuntu-latest
    needs: test
    env:
      # Empty until the world bucket is public; tile build, shots and the PR comment are skipped while it is empty.
      WORLD_BASE_URL: ${{ vars.WORLD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          echo "files<<EOF" >> $GITHUB_OUTPUT; git diff --name-only $BASE ${{ github.sha }} >> $GITHUB_OUTPUT; echo "EOF" >> $GITHUB_OUTPUT
          echo "tiles=$(git diff --name-only $BASE ${{ github.sha }} -- 'world/tiles/' | awk -F/ '{print $3}' | sort -u | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "heroes=$(git diff --name-only $BASE ${{ github.sha }} | grep -E '^world/heroes/[^/]+/hero\.json$' | awk -F/ '{print $3}' | sort -u | tr '\n' ' ')" >> $GITHUB_OUTPUT
      - name: hero models are published
        if: steps.changed.outputs.heroes != '' && env.WORLD_BASE_URL != ''
        run: |
          base="${WORLD_BASE_URL%/}/"
          fail=0
          for h in ${{ steps.changed.outputs.heroes }}; do
            f=world/heroes/$h/hero.json
            [ -f "$f" ] || continue
            sha=$(jq -r '.model.sha256 // empty' "$f")
            [ -n "$sha" ] || { echo "$h: no model yet, skipping"; continue; }
            url="${base}heroes/$h/$sha/model.glb"
            if curl -sfI "$url" > /dev/null; then echo "$h: $url ok"; else echo "::error file=$f::$h model is not published: HEAD $url failed; run: bun run pipeline upload --hero $h"; fail=1; fi
          done
          exit $fail
      - name: hero models not checked
        if: steps.changed.outputs.heroes != '' && env.WORLD_BASE_URL == ''
        run: echo "::warning::WORLD_BASE_URL is not set; not checking published models for ${{ steps.changed.outputs.heroes }}"
      - name: scope check
        if: github.event_name == 'pull_request'
        run: bun run pipeline scope-check --labels '${{ toJSON(github.event.pull_request.labels.*.name) }}' --base ${{ github.event.pull_request.base.sha }}
      - name: world host not configured
        if: steps.changed.outputs.tiles != '' && env.WORLD_BASE_URL == ''
        run: echo "::warning::WORLD_BASE_URL is not set; skipping build, validate and shots for ${{ steps.changed.outputs.tiles }}"
      - name: build and validate changed tiles
        if: steps.changed.outputs.tiles != '' && env.WORLD_BASE_URL != ''
        run: |
          mkdir -p dist
          for t in ${{ steps.changed.outputs.tiles }}; do
            bun run pipeline fetch-inputs $t && bun run pipeline build $t && bun run pipeline validate $t | tee -a dist/validate.log
          done
      - name: screenshots
        if: steps.changed.outputs.tiles != '' && env.WORLD_BASE_URL != ''
        run: |
          bunx playwright install --with-deps chromium
          mkdir -p apps/game/public
          ln -s ../../../dist apps/game/public/world
          WORLD_BASE_URL=http://localhost:5173/world/ bun run pipeline manifest
          (bun run dev > /tmp/dev.log 2>&1 &) ; sleep 6
          for t in ${{ steps.changed.outputs.tiles }}; do bun run pipeline shot $t; done
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.tiles != '' && env.WORLD_BASE_URL != ''
        with:
          name: shots-${{ github.run_id }}
          path: dist/shots/*.png
      - name: publish shots and comment
        if: github.event_name == 'pull_request' && steps.changed.outputs.tiles != '' && env.WORLD_BASE_URL != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER: bunx wrangler@4.122.0
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token: skipping shot publish"; exit 0; fi
          bun run pipeline pr-comment ${{ github.event.pull_request.number }}
